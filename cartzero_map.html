<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CartZero — NYC Vendor Ecosystem</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: #f0ede8; }

  .map-header {
    padding: 20px 28px 16px;
    display: flex; justify-content: space-between; align-items: flex-start;
    flex-wrap: wrap; gap: 12px;
  }
  .map-title {
    font-family: 'Bebas Neue', 'Arial Black', sans-serif;
    font-size: 22px; color: #f0ede8; letter-spacing: 0.02em;
  }
  .map-title span { color: #FF6600; }
  .map-subtitle {
    font-size: 11px; color: #888899; letter-spacing: 0.12em;
    text-transform: uppercase; margin-top: 2px;
    font-family: 'Courier New', monospace;
  }

  .stat-row {
    display: flex; gap: 20px; flex-wrap: wrap;
  }
  .stat-box {
    text-align: right;
  }
  .stat-num {
    font-family: 'Bebas Neue', 'Arial Black', sans-serif;
    font-size: 26px; color: #FF6600; line-height: 1;
  }
  .stat-label {
    font-size: 9px; color: #888899; letter-spacing: 0.15em;
    text-transform: uppercase; font-family: 'Courier New', monospace;
  }

  #map {
    width: 100%; height: calc(100vh - 140px);
    min-height: 360px;
    border-top: 1px solid rgba(255,102,0,0.15);
    border-bottom: 1px solid rgba(255,102,0,0.15);
  }

  /* Override Leaflet for dark theme */
  .leaflet-container { background: #0a0a0f; }
  .leaflet-control-zoom a {
    background: #1a1a24 !important;
    color: #FF6600 !important;
    border-color: rgba(255,102,0,0.2) !important;
  }
  .leaflet-control-zoom a:hover { background: #252530 !important; }
  .leaflet-control-attribution {
    background: rgba(10,10,15,0.85) !important;
    color: #555 !important; font-size: 9px !important;
  }
  .leaflet-control-attribution a { color: #666 !important; }

  .leaflet-popup-content-wrapper {
    background: #1a1a24; color: #f0ede8; border-radius: 4px;
    border: 1px solid rgba(255,102,0,0.25); box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .leaflet-popup-tip { background: #1a1a24; }
  .leaflet-popup-content {
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px;
    line-height: 1.5; margin: 12px 16px;
  }
  .popup-name {
    font-weight: 600; color: #FF6600; font-size: 13px;
    margin-bottom: 4px;
  }
  .popup-detail { color: #888899; }
  .popup-borough {
    font-family: 'Courier New', monospace; font-size: 10px;
    letter-spacing: 0.1em; color: #FF6600; text-transform: uppercase;
    margin-top: 6px; opacity: 0.7;
  }

  .legend {
    padding: 12px 28px 16px;
    display: flex; gap: 24px; flex-wrap: wrap; align-items: center;
  }
  .legend-item {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: #888899;
  }
  .legend-dot {
    width: 10px; height: 10px; border-radius: 50%;
    border: 2px solid; flex-shrink: 0;
  }
  .legend-heat {
    width: 40px; height: 10px; border-radius: 2px;
    background: linear-gradient(90deg, rgba(255,102,0,0.15), rgba(255,102,0,0.7));
  }
  .legend-note {
    font-family: 'Courier New', monospace; font-size: 9px;
    color: #555; letter-spacing: 0.05em; margin-left: auto;
  }
</style>
</head>
<body>

<div class="map-header">
  <div>
    <div class="map-title">NYC <span>Vendor Ecosystem</span></div>
    <div class="map-subtitle">69 Commissary Hubs · 5 Boroughs · Live Infrastructure Map</div>
  </div>
  <div class="stat-row">
    <div class="stat-box">
      <div class="stat-num">69</div>
      <div class="stat-label">Commissary Hubs</div>
    </div>
    <div class="stat-box">
      <div class="stat-num">23K</div>
      <div class="stat-label">Vendors NYC</div>
    </div>
    <div class="stat-box">
      <div class="stat-num">572</div>
      <div class="stat-label">Vendors/Hub MN</div>
    </div>
  </div>
</div>

<div id="map"></div>

<div class="legend">
  <div class="legend-item">
    <div class="legend-dot" style="background: #FF6600; border-color: #FF6600;"></div>
    Commissary Hub
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background: transparent; border-color: rgba(255,102,0,0.5);"></div>
    Vendor Density Zone
  </div>
  <div class="legend-item">
    <div class="legend-heat"></div>
    Vendor Concentration
  </div>
  <div class="legend-note">Source: NYC Open Data · DOHMH · Auerbach 2024</div>

<script>
// ── Map setup ─────────────────────────────────────────────────────
const map = L.map('map', {
  center: [40.735, -73.92],
  zoom: 11,
  zoomControl: true,
  attributionControl: true
});

// Dark tile layer
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  subdomains: 'abcd',
  maxZoom: 18
}).addTo(map);

// ── Borough vendor density (circle overlays) ──────────────────────
const boroughs = [
  { name: "Manhattan",     lat: 40.7831, lng: -73.9712, vendors: 5152, hubs: 9 },
  { name: "Queens",        lat: 40.7282, lng: -73.7949, vendors: 1967, hubs: 30 },
  { name: "Brooklyn",      lat: 40.6782, lng: -73.9442, vendors: 2032, hubs: 15 },
  { name: "Bronx",         lat: 40.8448, lng: -73.8648, vendors: 2285, hubs: 15 },
  { name: "Staten Island", lat: 40.5795, lng: -74.1502, vendors: 9,    hubs: 0 },
];

const maxVendors = Math.max(...boroughs.map(b => b.vendors));
boroughs.forEach(b => {
  const ratio = b.vendors / maxVendors;
  const radius = Math.max(ratio * 8000, 800);
  L.circle([b.lat, b.lng], {
    radius: radius,
    color: 'rgba(255,102,0,0.4)',
    fillColor: '#FF6600',
    fillOpacity: ratio * 0.25,
    weight: 1,
  }).addTo(map).bindPopup(
    `<div class="popup-name">${b.name}</div>` +
    `<div class="popup-detail">${b.vendors.toLocaleString()} vendors · ${b.hubs} commissary hubs</div>` +
    `<div class="popup-detail">${b.hubs > 0 ? Math.round(b.vendors / b.hubs) + ' vendors per hub' : 'No hubs'}</div>` +
    `<div class="popup-borough">${b.name}</div>`
  );
});

// Custom marker icon
const hubIcon = L.divIcon({

  html: `<div style="

    background: #FF6600;
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    box-shadow: 0 0 8px rgba(255,102,0,0.6);
  "></div>`,
  iconSize: [12, 12],
  iconAnchor: [6, 6],
});

commissaries.forEach(c => {
  L.marker([c.lat, c.lng], { icon: hubIcon })

    .bindPopup(
      `<div class="popup-name">${c.n}</div>` +

// ── Queens ZIP 11368 highlight (16% of all vendors) ───────────────
L.circle([40.7527, -73.8530], {
